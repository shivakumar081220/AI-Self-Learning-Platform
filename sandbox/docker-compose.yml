services:
  piston:
    image: ghcr.io/engineer-man/piston:latest
    container_name: ai-learning-piston
    privileged: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:2000:2000"
    environment:
      PISTON_DISABLE_NETWORKING: "true"
      PISTON_MAX_PROCESS_COUNT: "32"
      PISTON_MAX_OPEN_FILES: "64"
      PISTON_MAX_FILE_SIZE: "10000000"
      PISTON_OUTPUT_MAX_SIZE: "32768"
      PISTON_RUN_TIMEOUT: "10000"
      PISTON_RUN_CPU_TIME: "5000"
      PISTON_RUN_MEMORY_LIMIT: "268435456"
      PISTON_MAX_CONCURRENT_JOBS: "4"
    volumes:
      - piston-packages:/piston/packages
    tmpfs:
      - /tmp:exec
    mem_limit: 2g
    cpus: 2.0

volumes:
  piston-packages:
